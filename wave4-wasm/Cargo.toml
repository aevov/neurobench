[package]
name = "wave4-wasm"
version = "4.0.0"
edition = "2021"
description = "Wave 4 Benchmarks WASM Core — Tamper-proof scoring, classification, and token engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.69"
blake3 = "1.5"
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
